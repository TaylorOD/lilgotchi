<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tamagotchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* === Color Theme Variables === */
:root{
  --bg-page:#2a2a2a;
  --device-bg:linear-gradient(145deg,#e8d5c4,#c9a882);
  --device-shadow:0 8px 32px rgba(0,0,0,.5);
  --device-inset:inset 0 2px 4px rgba(255,255,255,.3);
  --screen-frame:#7b8868;
  --screen-inset:inset 0 3px 8px rgba(0,0,0,.4);
  --lcd-bg:#c4cfa1;
  --lcd-fg:#0f380f;
  --attn-bar:#7b8868;
  --attn-active:#ff4444;
  --btn-bg:linear-gradient(180deg,#5a6650,#3d4636);
  --btn-border:#2a2e25;
  --btn-color:#c4cfa1;
  --btn-shadow:0 3px 6px rgba(0,0,0,.3);
  --btn-inset:inset 0 1px 1px rgba(255,255,255,.1);
  --btn-active-bg:linear-gradient(180deg,#8bac0f,#5a6650);
  --accent:#8bac0f;
  --accent-dark:#0f380f;
  --toast-bg:#1a2a1a;
  --toast-border:#8bac0f;
  --toast-color:#c4cfa1;
  --settings-btn-color:#8b7355;
  --overlay-bg:rgba(0,0,0,.85);
  --overlay-color:#c4cfa1;
  --overlay-btn-bg:linear-gradient(180deg,#5a6650,#3d4636);
  --overlay-btn-border:#8bac0f;
  --overlay-btn-color:#c4cfa1;
  --overlay-btn-active-bg:#8bac0f;
  --overlay-btn-active-color:#0f380f;
  --overlay-close-color:#888;
  --overlay-close-border:#555;
  --overlay-close-active:#333;
  --stat-border:#3d4636;
  --stat-hearts:#8bac0f;
  --input-bg:#1a1a1a;
  --input-border:#8bac0f;
  --input-color:#c4cfa1;
  --info-color:#666;
  --death-msg:#888;
  --dialogue-bg:#1a2a1a;
  --dialogue-border:#8bac0f;
  --dialogue-color:#c4cfa1;
  --toggle-bg:#333;
  --toggle-knob:#888;
  --toggle-active-bg:#8bac0f;
  --toggle-active-knob:#fff;
}

/* === E-ink Theme === */
.eink{
  --bg-page:#e8e8e8;
  --device-bg:linear-gradient(145deg,#f5f5f5,#d8d8d8);
  --device-shadow:0 4px 16px rgba(0,0,0,.15);
  --device-inset:inset 0 1px 2px rgba(255,255,255,.6);
  --screen-frame:#b0b0b0;
  --screen-inset:inset 0 2px 6px rgba(0,0,0,.2);
  --lcd-bg:#f0f0f0;
  --lcd-fg:#111;
  --attn-bar:#b0b0b0;
  --attn-active:#222;
  --btn-bg:linear-gradient(180deg,#e0e0e0,#c8c8c8);
  --btn-border:#999;
  --btn-color:#222;
  --btn-shadow:0 2px 4px rgba(0,0,0,.12);
  --btn-inset:inset 0 1px 1px rgba(255,255,255,.5);
  --btn-active-bg:linear-gradient(180deg,#333,#555);
  --accent:#333;
  --accent-dark:#f0f0f0;
  --toast-bg:#fff;
  --toast-border:#333;
  --toast-color:#111;
  --settings-btn-color:#555;
  --overlay-bg:rgba(240,240,240,.96);
  --overlay-color:#111;
  --overlay-btn-bg:linear-gradient(180deg,#e0e0e0,#c8c8c8);
  --overlay-btn-border:#333;
  --overlay-btn-color:#111;
  --overlay-btn-active-bg:#333;
  --overlay-btn-active-color:#f0f0f0;
  --overlay-close-color:#555;
  --overlay-close-border:#999;
  --overlay-close-active:#ddd;
  --stat-border:#ccc;
  --stat-hearts:#111;
  --input-bg:#fff;
  --input-border:#555;
  --input-color:#111;
  --info-color:#777;
  --death-msg:#555;
  --dialogue-bg:#fff;
  --dialogue-border:#333;
  --dialogue-color:#111;
  --toggle-bg:#ccc;
  --toggle-knob:#888;
  --toggle-active-bg:#333;
  --toggle-active-knob:#fff;
}
/* E-ink: hide color emoji, show mono SVG icons */
.eink .icon-color{display:none!important}
.eink .icon-mono{display:block!important}
.eink .ctrl-btn:active{color:#f0f0f0}
.eink .ctrl-btn:active .icon-mono{color:#f0f0f0}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-page);font-family:'Courier New',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}

#device{
  width:100%;max-width:380px;
  background:var(--device-bg);
  border-radius:48% 48% 44% 44% / 52% 52% 42% 42%;
  padding:18px 14px 24px;
  box-shadow:var(--device-shadow),var(--device-inset);
  position:relative;
  display:flex;flex-direction:column;align-items:center;
}

#screen-frame{
  background:var(--screen-frame);
  border-radius:12px;
  padding:6px;
  box-shadow:var(--screen-inset);
  width:92%;
}
#lcd{
  display:block;width:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  border-radius:6px;
}

#attention-bar{
  width:92%;height:6px;margin:6px 0;border-radius:3px;
  background:var(--attn-bar);transition:background .3s;
}
#attention-bar.active{
  background:var(--attn-active);
  animation:blink-bar .6s infinite;
}
@keyframes blink-bar{0%,100%{opacity:1}50%{opacity:.3}}

#controls{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  width:94%;margin-top:10px;
}
.ctrl-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--btn-bg);
  border:2px solid var(--btn-border);border-radius:10px;
  color:var(--btn-color);font-size:10px;font-family:'Courier New',monospace;
  padding:10px 4px;cursor:pointer;user-select:none;
  box-shadow:var(--btn-shadow),var(--btn-inset);
  transition:transform .08s,box-shadow .08s,opacity .2s;
  min-height:56px;
  position:relative;
}
.ctrl-btn:active{
  transform:translateY(2px);
  box-shadow:0 1px 2px rgba(0,0,0,.3);
  background:var(--btn-active-bg);
}
.ctrl-btn.disabled{
  opacity:.35;
  pointer-events:none;
}
.ctrl-btn .icon{font-size:20px;line-height:1;margin-bottom:2px}
.ctrl-btn .icon-mono{display:none;width:22px;height:22px;margin-bottom:2px}
.ctrl-btn .label{font-size:9px;letter-spacing:.5px;text-transform:uppercase;opacity:.8}

/* Toast notification */
#toast{
  position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--toast-bg);border:2px solid var(--toast-border);border-radius:10px;
  padding:10px 20px;color:var(--toast-color);font-size:13px;
  font-family:'Courier New',monospace;
  z-index:300;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:transform .3s ease;
  pointer-events:none;
}
#toast.show{
  transform:translateX(-50%) translateY(0);
}

#settings-btn{
  position:absolute;top:10px;right:16px;
  background:none;border:none;color:var(--settings-btn-color);font-size:20px;cursor:pointer;
  opacity:.6;z-index:10;
}
#settings-btn:active{opacity:1}

/* Overlays */
.overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:var(--overlay-bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;color:var(--overlay-color);font-family:'Courier New',monospace;
}
.overlay.show{display:flex}
.overlay-title{font-size:18px;margin-bottom:20px;color:var(--accent);letter-spacing:2px}
.overlay-btn{
  display:block;width:220px;padding:16px;margin:8px;
  background:var(--overlay-btn-bg);
  border:2px solid var(--overlay-btn-border);border-radius:12px;
  color:var(--overlay-btn-color);font-size:16px;text-align:center;cursor:pointer;
  font-family:'Courier New',monospace;
  transition:background .1s;
}
.overlay-btn:active{background:var(--overlay-btn-active-bg);color:var(--overlay-btn-active-color)}
.overlay-close{
  margin-top:20px;color:var(--overlay-close-color);font-size:14px;cursor:pointer;
  padding:12px 24px;border:1px solid var(--overlay-close-border);border-radius:8px;
}
.overlay-close:active{background:var(--overlay-close-active)}

/* Stats overlay */
#stats-overlay .stat-row{
  display:flex;align-items:center;justify-content:space-between;
  width:260px;padding:8px 0;border-bottom:1px solid var(--stat-border);
  font-size:14px;
}
#stats-overlay .hearts{color:var(--stat-hearts);font-size:18px;letter-spacing:2px}

/* Game overlay */
#game-overlay .game-area{
  display:flex;align-items:center;justify-content:center;gap:30px;
  margin:20px 0;
}
#game-overlay .game-arrow{
  width:80px;height:80px;
  background:var(--overlay-btn-bg);
  border:2px solid var(--accent);border-radius:50%;
  color:var(--overlay-btn-color);font-size:36px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .1s;
}
#game-overlay .game-arrow:active{background:var(--overlay-btn-active-bg);color:var(--overlay-btn-active-color)}
#game-overlay .game-arrow.disabled{opacity:.3;pointer-events:none}
#game-overlay .game-score{font-size:16px;margin:10px 0;color:var(--accent)}
#game-overlay .game-result{font-size:14px;min-height:20px;color:var(--overlay-color)}
#game-overlay .game-pet{width:80px;height:80px;display:flex;align-items:center;justify-content:center}
#game-pet-canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* Settings modal */
#settings-overlay{z-index:200}
#settings-overlay input{
  width:260px;padding:12px;margin:10px 0;
  background:var(--input-bg);border:2px solid var(--input-border);border-radius:8px;
  color:var(--input-color);font-size:14px;font-family:'Courier New',monospace;
}
#settings-overlay .settings-info{
  font-size:11px;color:var(--info-color);max-width:260px;text-align:center;margin:6px 0 16px;
}
/* Settings toggle row */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  width:260px;padding:10px 0;margin:4px 0;
}
.settings-row span{font-size:14px}
.toggle{
  width:48px;height:26px;border-radius:13px;
  background:var(--toggle-bg);
  position:relative;cursor:pointer;
  transition:background .2s;border:none;padding:0;
}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:var(--toggle-knob);
  transition:transform .2s,background .2s;
}
.toggle.on{background:var(--toggle-active-bg)}
.toggle.on::after{transform:translateX(22px);background:var(--toggle-active-knob)}

/* Death overlay */
#death-overlay{z-index:150}
#death-overlay .death-msg{font-size:14px;color:var(--death-msg);margin:10px 0}

/* Dialogue bubble */
#dialogue{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  max-width:340px;width:90%;
  background:var(--dialogue-bg);border:2px solid var(--dialogue-border);border-radius:12px;
  padding:12px 16px;color:var(--dialogue-color);font-size:13px;
  font-family:'Courier New',monospace;
  display:none;z-index:50;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
#dialogue.show{display:block}
#dialogue::before{
  content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-bottom:8px solid var(--dialogue-border);
}
</style>
</head>
<body>

// ============================================================
// SOUND MANAGER
// ============================================================
class SoundManager {
  constructor(){ this.ctx=null; this.muted=false; }
  init(){ if(!this.ctx) try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  beep(freq,dur,vol=.15){
    if(this.muted||!this.ctx) return;
    try{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='square'; o.frequency.value=freq; g.gain.value=vol;
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime+dur/1000);
    }catch(e){}
  }
  btnPress(){ this.beep(800,50); }
  attention(){ this.beep(1000,100); setTimeout(()=>this.beep(1200,100),150); }
  happy(){ this.beep(600,80); setTimeout(()=>this.beep(900,120),100); }
  sad(){ this.beep(300,200); }
  gameWin(){ [0,100,200].forEach((d,i)=>setTimeout(()=>this.beep(600+i*200,100),d)); }
  gameLose(){ this.beep(400,100); setTimeout(()=>this.beep(200,200),120); }
  death(){ this.beep(200,500,.1); }
  hatch(){ [0,150,300,450].forEach((d,i)=>setTimeout(()=>this.beep(500+i*100,80),d)); }
  eat(){ this.beep(500,60); setTimeout(()=>this.beep(600,60),80); }
  clean(){ this.beep(700,50); setTimeout(()=>this.beep(900,50),60); setTimeout(()=>this.beep(1100,50),120); }
  medicine(){ this.beep(400,80); setTimeout(()=>this.beep(600,80),100); setTimeout(()=>this.beep(800,80),200); }
  discipline(){ this.beep(200,100); setTimeout(()=>this.beep(400,100),120); }
  denied(){ this.beep(200,150,.1); }
  toggleMute(){ this.muted=!this.muted; }
}

// ============================================================
// RENDERER
// ============================================================
class Renderer {
  constructor(canvas){
    this.canvas=canvas;
    this.ctx=canvas.getContext('2d');
    this.w=C.W; this.h=C.H;
    this.buf=Array.from({length:this.h},()=>new Uint8Array(this.w));
    this.updateColors();
    canvas.width=this.w*C.SCALE;
    canvas.height=this.h*C.SCALE;
  }
  updateColors(){
    const s=getComputedStyle(document.documentElement);
    this.bg=s.getPropertyValue('--lcd-bg').trim()||'#c4cfa1';
    this.fg=s.getPropertyValue('--lcd-fg').trim()||'#0f380f';
  }
  clear(){ for(let y=0;y<this.h;y++) this.buf[y].fill(0); }
  setPixel(x,y,v=1){ if(x>=0&&x<this.w&&y>=0&&y<this.h) this.buf[y][x]=v; }
  drawSprite(sp,px,py){
    for(let y=0;y<sp.length;y++)
      for(let x=0;x<sp[y].length;x++)
        if(sp[y][x]) this.setPixel(px+x,py+y);
  }
  drawText(txt,px,py){
    let cx=px;
    for(const ch of txt.toUpperCase()){
      const g=PF[ch];
      if(g){ this.drawSprite(g,cx,py); cx+=g[0].length+1; }
      else cx+=3;
    }
  }
  drawHearts(count,max,px,py){
    for(let i=0;i<max;i++) this.drawSprite(i<count?SP.heart:SP.heartEmpty,px+i*6,py);
  }
  // Progress bar: x,y, width, fraction 0-1
  drawBar(px,py,w,frac){
    for(let x=0;x<w;x++) this.setPixel(px+x,py);
    for(let x=0;x<w;x++) this.setPixel(px+x,py+2);
    this.setPixel(px,py+1); this.setPixel(px+w-1,py+1);
    const fill=Math.floor((w-2)*Math.min(1,frac));
    for(let x=0;x<fill;x++) this.setPixel(px+1+x,py+1);
  }
  render(invert=false){
    const s=C.SCALE;
    this.ctx.fillStyle=invert?this.fg:this.bg;
    this.ctx.fillRect(0,0,this.w*s,this.h*s);
    this.ctx.fillStyle=invert?this.bg:this.fg;
    for(let y=0;y<this.h;y++)
      for(let x=0;x<this.w;x++)
        if(this.buf[y][x])
          this.ctx.fillRect(x*s+1,y*s+1,s-1,s-1);
  }
  renderToCanvas(canvas,sp){
    const ctx=canvas.getContext('2d');
    const s=4;
    canvas.width=sp[0].length*s;
    canvas.height=sp.length*s;
    ctx.fillStyle=this.bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle=this.fg;
    for(let y=0;y<sp.length;y++)
      for(let x=0;x<sp[y].length;x++)
        if(sp[y][x]) ctx.fillRect(x*s,y*s,s,s);
  }
}

class GameState {
  constructor(){ this.reset(); }
  reset(){
    const now=Date.now();
    Object.assign(this,{
      stage:'egg', character:'egg', age:0, weight:5,
      hunger:0, happiness:0, discipline:0,
      careMistakes:0, poopCount:0,
      isSick:false, isSleeping:false, lightOn:true,
      isDead:false, isMisbehaving:false,
      bornAt:now, stageStartTime:now,
      lastHungerDecay:now, lastHappyDecay:now,
      lastPoopTime:now, lastAgeInc:now,
      attentionCallTime:null, attentionReason:null,
      snacksInWindow:0, snackWindowStart:now,
      medDoses:0, prevTeen:null, sickCount:0,
    });
  }
  save(){ try{ localStorage.setItem('tama_save',JSON.stringify(this)); }catch(e){} }
  load(){
    try{
      const d=localStorage.getItem('tama_save');
      if(d){ Object.assign(this,JSON.parse(d)); return true; }
    }catch(e){}
    return false;
  }
  clearSave(){ try{ localStorage.removeItem('tama_save'); }catch(e){} }
}

// ============================================================
// EVOLUTION ENGINE
// ============================================================
const Evo = {
  evolve(st){
    switch(st.stage){
      case 'egg': return {stage:'baby',character:'babytchi',weight:C.BASE_WT.baby};
      case 'baby': return {stage:'child',character:'marutchi',weight:C.BASE_WT.child};
      case 'child':
        if(st.careMistakes<=1)
          return {stage:'teen',character:'tamatchi',weight:C.BASE_WT.teen};
        return {stage:'teen',character:'kuchitamatchi',weight:C.BASE_WT.teen};
      case 'teen': return Evo.toAdult(st);
      default: return null;
    }
  },
  toAdult(st){
    const d=st.discipline, cm=st.careMistakes;
    if(st.character==='tamatchi'){
      if(cm<=2&&d>=100) return {stage:'adult',character:'mametchi',weight:25};
      if(cm<=2&&d>=75) return {stage:'adult',character:'ginjirotchi',weight:30};
      if(cm<=4&&d>=50) return {stage:'adult',character:'maskutchi',weight:30};
      if(d>=50) return {stage:'adult',character:'kuchipatchi',weight:35};
      if(d>=25) return {stage:'adult',character:'nyorotchi',weight:30};
      return {stage:'adult',character:'tarakotchi',weight:35};
    }
    if(d>=75) return {stage:'adult',character:'kuchipatchi',weight:35};
    if(d>=50) return {stage:'adult',character:'nyorotchi',weight:30};
    return {stage:'adult',character:'tarakotchi',weight:35};
  },
  shouldEvolve(st){
    const e=Date.now()-st.stageStartTime;
    switch(st.stage){
      case 'egg': return e>=C.EGG_MS;
      case 'baby': return e>=C.BABY_MS;
      case 'child': return e>=C.CHILD_MS;
      case 'teen': return e>=C.TEEN_MS;
      default: return false;
    }
  },
  checkOyajitchi(st){
    return st.character==='maskutchi'&&st.discipline>=100&&st.age>=10;
  }
};

// ============================================================
// AI MANAGER (OpenAI)
// ============================================================
class AIManager {
  constructor(){ this.key=localStorage.getItem('openai_api_key')||null; this.busy=false; }
  get on(){ return !!this.key; }
  setKey(k){ this.key=k||null; if(k) localStorage.setItem('openai_api_key',k); else localStorage.removeItem('openai_api_key'); }
  sysPrompt(st){
    const p={
      babytchi:'a curious newborn baby, very simple speech, coos and babbles',
      marutchi:'a playful child, energetic, uses simple words',
      tamatchi:'a well-behaved teenager, friendly and eager to learn',
      kuchitamatchi:'a mischievous teenager with a big appetite, a bit sassy',
      mametchi:'intelligent, studious, polite, sometimes nerdy',
      ginjirotchi:'friendly, gentle, easygoing, loves everyone',
      maskutchi:'mysterious, cool, a bit shy but loyal',
      kuchipatchi:'laid-back, food-loving, cheerful, always hungry',
      nyorotchi:'super chill, unbothered, lazy but content',
      tarakotchi:'grumpy, disheveled, low-energy, sarcastic',
      oyajitchi:'a wise old man, eccentric, philosophical, tells stories',
    };
    return `You are a Tamagotchi virtual pet named ${st.character}. ${p[st.character]||'a virtual pet'}.
Stats: hunger ${st.hunger}/4, happiness ${st.happiness}/4, discipline ${st.discipline}%, age ${st.age} days, weight ${st.weight}.
Respond in 1-2 short sentences as this character. Be expressive. Stay in character.`;
  }
  async talk(st,event){
    if(!this.on||this.busy) return null;
    this.busy=true;
    const prompts={
      fed_meal:'Your owner fed you a meal. React.',
      fed_snack:'Your owner gave you a snack! React happily.',
      played_won:'You played a game and won! Express joy.',
      played_lost:'You played a game and lost. React.',
      cleaned:'Your owner cleaned up after you. React.',
      woke_up:'You just woke up. Say good morning.',
      going_sleep:'Bedtime! Say goodnight.',
      hungry:'You are hungry. Ask for food.',
      sad:'You are feeling sad. Express it.',
      sick:'You feel sick. Ask for medicine.',
      evolved:`You evolved into ${st.character}! React to your new form.`,
      discipline:'Your owner scolded you. React.',
      idle:'Share a random brief thought.',
      misbehave:'You are being naughty. Why?',
    };
    try{
      const r=await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${this.key}`},
        body:JSON.stringify({model:'gpt-4o-mini',messages:[
          {role:'system',content:this.sysPrompt(st)},
          {role:'user',content:prompts[event]||'Share a brief thought.'},
        ],max_tokens:60,temperature:.8}),
      });
      const d=await r.json();
      this.busy=false;
      return d.choices?.[0]?.message?.content||null;
    }catch(e){ this.busy=false; return null; }
  }
}

class TamagotchiApp {
  constructor(){
    this.renderer=new Renderer(document.getElementById('lcd'));
    this.sound=new SoundManager();
    this.state=new GameState();
    this.ai=new AIManager();
    this.frame=0;
    this.animState=null;
    this.animTimer=0;
    this.gameActive=false;
    this.gameRound=0;
    this.gameWins=0;
    this.gameDir=0;
    this.gamePhase='idle';
    this.toastTimer=null;
    this.eink=localStorage.getItem('tama_eink')==='1';
    this.init();
  }

  applyTheme(){
    document.documentElement.classList.toggle('eink',this.eink);
    localStorage.setItem('tama_eink',this.eink?'1':'0');
    this.renderer.updateColors();
  }

  init(){
    this.applyTheme();
    if(this.state.load()){
      this.processMissedTime();
    } else {
      this.state.reset();
    }
    // Init audio on first interaction
    const initAudio=()=>{ this.sound.init(); };
    document.addEventListener('touchstart',initAudio,{once:true});
    document.addEventListener('click',initAudio,{once:true});

    // Control button handlers
    document.querySelectorAll('.ctrl-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.preventDefault();
        this.sound.init(); // ensure audio context
        this.sound.btnPress();
        this.handleAction(btn.dataset.action);
      });
    });

    // Feed overlay buttons
    document.getElementById('feed-meal-btn').addEventListener('click',e=>{
      e.preventDefault(); this.doFeed('meal'); this.closeOverlay('feed-overlay');
    });
    document.getElementById('feed-snack-btn').addEventListener('click',e=>{
      e.preventDefault(); this.doFeed('snack'); this.closeOverlay('feed-overlay');
    });

    // Close overlays
    document.querySelectorAll('[data-close]').forEach(el=>{
      el.addEventListener('click',e=>{ e.preventDefault(); this.closeOverlay(el.dataset.close); });
    });

    // Game arrows
    document.getElementById('guess-left').addEventListener('click',()=>this.gameGuess(0));
    document.getElementById('guess-right').addEventListener('click',()=>this.gameGuess(1));

    // Settings
    document.getElementById('settings-btn').addEventListener('click',()=>{
      document.getElementById('api-key-input').value=this.ai.key||'';
      // Sync toggle state
      document.getElementById('eink-toggle').classList.toggle('on',this.eink);
      this.openOverlay('settings-overlay');
    });
    document.getElementById('eink-toggle').addEventListener('click',()=>{
      this.eink=!this.eink;
      document.getElementById('eink-toggle').classList.toggle('on',this.eink);
      this.applyTheme();
      this.toast(this.eink?'E-ink theme on':'Default theme');
    });
    document.getElementById('save-key-btn').addEventListener('click',()=>{
      this.ai.setKey(document.getElementById('api-key-input').value.trim());
      this.toast(this.ai.on?'API key saved':'API key cleared');
      this.closeOverlay('settings-overlay');
    });
    document.getElementById('clear-key-btn').addEventListener('click',()=>{
      this.ai.setKey(null);
      document.getElementById('api-key-input').value='';
      this.toast('API key cleared');
      this.closeOverlay('settings-overlay');
    });
    document.getElementById('reset-game-btn').addEventListener('click',()=>{
      if(confirm('Reset your Tamagotchi? This cannot be undone.')){
        this.state.clearSave(); this.state.reset();
        this.closeOverlay('settings-overlay'); this.closeOverlay('death-overlay');
        this.toast('New egg started!');
      }
    });
    document.getElementById('restart-btn').addEventListener('click',()=>{
      this.state.clearSave(); this.state.reset();
      this.closeOverlay('death-overlay');
      this.toast('New egg started!');
    });

    // Visibility change
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden) this.state.save();
      else { this.state.load(); this.processMissedTime(); }
    });

    // Start loops
    setInterval(()=>this.tick(),1000);
    const renderLoop=()=>{ this.render(); requestAnimationFrame(renderLoop); };
    requestAnimationFrame(renderLoop);
    setInterval(()=>this.state.save(),30000);
    setInterval(()=>this.maybeMisbehave(),600000);
    setInterval(()=>{
      if(this.ai.on&&!this.state.isDead&&!this.state.isSleeping&&this.state.stage!=='egg'&&Math.random()<.2)
        this.ai.talk(this.state,'idle').then(d=>{if(d)this.showDialogue(d);});
    },300000);

    // Update button states immediately and periodically
    this.updateButtons();
    setInterval(()=>this.updateButtons(),2000);

    if(this.state.isDead) this.showDeath();
  }

  // -- TOAST NOTIFICATIONS --
  toast(msg){
    const el=document.getElementById('toast');
    el.textContent=msg;
    el.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
  }

  // -- BUTTON STATE UPDATES --
  updateButtons(){
    const st=this.state;
    const btns=document.querySelectorAll('.ctrl-btn');
    btns.forEach(btn=>{
      const action=btn.dataset.action;
      let disabled=false;
      if(st.isDead&&action!=='mute') disabled=true;
      else switch(action){
        case 'feed': disabled=st.stage==='egg'||st.isSleeping; break;
        case 'light': disabled=st.stage==='egg'; break;
        case 'play': disabled=st.stage==='egg'||st.isSleeping||st.isSick; break;
        case 'medicine': disabled=!st.isSick; break;
        case 'clean': disabled=st.poopCount===0; break;
        case 'discipline': disabled=!st.isMisbehaving; break;
        case 'stats': disabled=st.stage==='egg'; break;
      }
      btn.classList.toggle('disabled',disabled);
    });
  }

  // -- TIME CATCH-UP --
  processMissedTime(){
    const st=this.state, now=Date.now();
    if(st.isDead||st.stage==='egg') return;
    const hRate=C.HUNGER_DECAY[st.stage]||3600000;
    const hpRate=C.HAPPY_DECAY[st.stage]||3600000;
    const pRate=C.POOP_RATE[st.stage]||10800000;
    const missedH=Math.floor((now-st.lastHungerDecay)/hRate);
    const missedHp=Math.floor((now-st.lastHappyDecay)/hpRate);
    const missedP=Math.floor((now-st.lastPoopTime)/pRate);
    st.hunger=Math.max(0,st.hunger-missedH);
    st.happiness=Math.max(0,st.happiness-missedHp);
    st.poopCount=Math.min(C.MAX_POOP,st.poopCount+missedP);
    const missedCare=Math.floor(Math.max(missedH,missedHp)/4);
    st.careMistakes+=Math.min(missedCare,3);
    st.lastHungerDecay=now; st.lastHappyDecay=now; st.lastPoopTime=now;
    const missedDays=Math.floor((now-st.lastAgeInc)/86400000);
    st.age+=missedDays;
    if(missedDays>0) st.lastAgeInc=now;
    while(Evo.shouldEvolve(st)){
      const r=Evo.evolve(st);
      if(r){ st.stage=r.stage; st.character=r.character; st.weight=r.weight; st.stageStartTime=now; }
      else break;
    }
    if(st.stage==='adult'&&(st.careMistakes>=C.ADULT_MAX_MISTAKES||st.age>=C.MAX_AGE)){
      st.isDead=true; st.stage='dead';
    }
  }

  // -- GAME TICK --
  tick(){
    const st=this.state, now=Date.now();
    if(st.isDead) return;

    if(st.stage==='egg'){
      if(Evo.shouldEvolve(st)) this.doEvolve();
      return;
    }

    this.checkSleep();
    if(st.isSleeping) return;

    const hRate=C.HUNGER_DECAY[st.stage]||3600000;
    if(now-st.lastHungerDecay>=hRate){
      if(st.hunger>0) st.hunger--;
      st.lastHungerDecay=now;
    }
    const hpRate=C.HAPPY_DECAY[st.stage]||3600000;
    if(now-st.lastHappyDecay>=hpRate){
      if(st.happiness>0) st.happiness--;
      st.lastHappyDecay=now;
    }
    const pRate=C.POOP_RATE[st.stage]||10800000;
    if(now-st.lastPoopTime>=pRate&&st.poopCount<C.MAX_POOP){
      st.poopCount++; st.lastPoopTime=now;
    }
    if(now-st.lastAgeInc>=86400000){ st.age++; st.lastAgeInc=now; }
    if(st.poopCount>=3&&!st.isSick&&Math.random()<.01) this.makeSick();

    this.checkAttention();

    if(st.attentionCallTime&&now-st.attentionCallTime>=C.CARE_WINDOW){
      st.careMistakes++;
      st.attentionCallTime=null; st.attentionReason=null;
    }

    if(Evo.shouldEvolve(st)&&!st.isSick) this.doEvolve();

    if(st.stage==='adult'){
      if(st.careMistakes>=C.ADULT_MAX_MISTAKES||st.age>=C.MAX_AGE){
        st.isDead=true; st.stage='dead';
        this.sound.death(); this.showDeath();
      }
      if(!st.isDead&&Evo.checkOyajitchi(st)&&st.character!=='oyajitchi'&&Math.random()<.05){
        st.character='oyajitchi';
        this.sound.hatch();
        this.animState='evolve'; this.animTimer=Date.now();
        if(this.ai.on) this.ai.talk(st,'evolved').then(d=>{if(d)this.showDialogue(d);});
      }
    }

    const bar=document.getElementById('attention-bar');
    bar.classList.toggle('active',st.attentionCallTime!=null);

    if(st.attentionCallTime&&now%4000<1000) this.sound.attention();

    this.updateButtons();
  }

  checkSleep(){
    const st=this.state, h=new Date().getHours();
    const sch=C.SLEEP[st.stage];
    if(!sch) return;
    const shouldSleep=(h>=sch.s||h<sch.w);
    if(shouldSleep&&!st.isSleeping){
      st.isSleeping=true;
      if(this.ai.on) this.ai.talk(st,'going_sleep').then(d=>{if(d)this.showDialogue(d);});
    }
    if(!shouldSleep&&st.isSleeping){
      st.isSleeping=false; st.lightOn=true;
      if(this.ai.on) this.ai.talk(st,'woke_up').then(d=>{if(d)this.showDialogue(d);});
    }
  }

  checkAttention(){
    const st=this.state;
    if(st.isSick&&!st.attentionCallTime){
      st.attentionCallTime=Date.now(); st.attentionReason='sick'; return;
    }
    if(st.hunger===0&&!st.attentionCallTime&&!st.isMisbehaving){
      st.attentionCallTime=Date.now(); st.attentionReason='hungry';
      if(this.ai.on) this.ai.talk(st,'hungry').then(d=>{if(d)this.showDialogue(d);});
      return;
    }
    if(st.happiness===0&&!st.attentionCallTime&&!st.isMisbehaving){
      st.attentionCallTime=Date.now(); st.attentionReason='sad';
      if(this.ai.on) this.ai.talk(st,'sad').then(d=>{if(d)this.showDialogue(d);});
      return;
    }
    if(!st.attentionCallTime&&st.isMisbehaving){
      st.attentionCallTime=Date.now(); st.attentionReason='misbehave';
    }
    if(st.attentionCallTime&&!st.isSick&&st.hunger>0&&st.happiness>0&&!st.isMisbehaving){
      st.attentionCallTime=null; st.attentionReason=null;
    }
  }

  makeSick(){
    const st=this.state;
    st.isSick=true;
    st.medDoses=1+Math.floor(Math.random()*2);
    st.sickCount++;
    if(this.ai.on) this.ai.talk(st,'sick').then(d=>{if(d)this.showDialogue(d);});
  }

  doEvolve(){
    const st=this.state;
    const r=Evo.evolve(st);
    if(!r) return;
    const oldStage=st.stage;
    st.stage=r.stage; st.character=r.character; st.weight=r.weight;
    st.stageStartTime=Date.now();
    if(r.stage!=='adult'){ st.hunger=C.MAX_HUNGER; st.happiness=C.MAX_HAPPY; }
    if(r.stage==='teen') st.prevTeen=r.character;
    this.sound.hatch();
    this.animState='evolve'; this.animTimer=Date.now();
    const name=r.character.charAt(0).toUpperCase()+r.character.slice(1);
    this.toast(`Evolved into ${name}!`);
    this.updateButtons();
    if(this.ai.on) this.ai.talk(st,'evolved').then(d=>{if(d)this.showDialogue(d);});
  }

  maybeMisbehave(){
    const st=this.state;
    if(st.isDead||st.isSleeping||st.stage==='egg'||st.stage==='baby') return;
    if(Math.random()<.05&&!st.isMisbehaving&&st.hunger>0&&st.happiness>0){
      st.isMisbehaving=true;
      this.updateButtons();
      if(this.ai.on) this.ai.talk(st,'misbehave').then(d=>{if(d)this.showDialogue(d);});
    }
  }

  // -- ACTIONS --
  handleAction(action){
    const st=this.state;

    // Mute always works
    if(action==='mute'){
      this.sound.toggleMute();
      const mb=document.getElementById('mute-btn');
      mb.querySelector('.icon-color').innerHTML=this.sound.muted?'&#128263;':'&#128264;';
      const svg=document.getElementById('mute-icon-mono');
      svg.innerHTML=this.sound.muted
        ?'<polygon points="6,9 2,9 2,15 6,15 11,19 11,5" fill="currentColor" stroke="none"/><line x1="16" y1="8" x2="22" y2="16"/><line x1="22" y1="8" x2="16" y2="16"/>'
        :'<polygon points="6,9 2,9 2,15 6,15 11,19 11,5" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 7a7 7 0 0 1 0 10"/>';
      mb.querySelector('.label').textContent=this.sound.muted?'Muted':'Sound';
      this.toast(this.sound.muted?'Sound off':'Sound on');
      return;
    }

    if(st.isDead){ this.toast('Your pet has passed away...'); return; }

    switch(action){
      case 'feed':
        if(st.stage==='egg'){ this.toast('Egg is hatching... wait!'); this.sound.denied(); return; }
        if(st.isSleeping){ this.toast('Shh... sleeping!'); this.sound.denied(); return; }
        this.openOverlay('feed-overlay');
        break;

      case 'light':
        if(st.stage==='egg'){ this.toast('Egg is hatching... wait!'); this.sound.denied(); return; }
        st.lightOn=!st.lightOn;
        this.toast(st.lightOn?'Light on':'Light off');
        break;

      case 'play':
        if(st.stage==='egg'){ this.toast('Egg is hatching... wait!'); this.sound.denied(); return; }
        if(st.isSleeping){ this.toast('Shh... sleeping!'); this.sound.denied(); return; }
        if(st.isSick){ this.toast('Too sick to play!'); this.sound.denied(); return; }
        if(st.hunger===0){ this.toast('Too hungry to play! Feed first.'); this.sound.denied(); return; }
        this.startGame();
        break;

      case 'medicine':
        if(!st.isSick){ this.toast('Not sick!'); this.sound.denied(); return; }
        st.medDoses--;
        this.sound.medicine();
        this.animState='medicine'; this.animTimer=Date.now();
        if(st.medDoses<=0){
          st.isSick=false; st.medDoses=0;
          st.attentionCallTime=null; st.attentionReason=null;
          this.toast('Cured!');
        } else {
          this.toast('Medicine given... needs more');
        }
        this.updateButtons();
        break;

      case 'clean':
        if(st.poopCount===0){ this.toast('Already clean!'); this.sound.denied(); return; }
        st.poopCount=0;
        this.sound.clean();
        this.animState='clean'; this.animTimer=Date.now();
        this.toast('Cleaned up!');
        this.updateButtons();
        if(this.ai.on) this.ai.talk(st,'cleaned').then(d=>{if(d)this.showDialogue(d);});
        break;

      case 'stats':
        if(st.stage==='egg'){
          const pct=Math.min(100,Math.floor((Date.now()-st.stageStartTime)/C.EGG_MS*100));
          this.toast(`Hatching: ${pct}%`);
          return;
        }
        this.showStats();
        break;

      case 'discipline':
        if(!st.isMisbehaving){ this.toast('Not misbehaving!'); this.sound.denied(); return; }
        st.discipline=Math.min(st.discipline+C.DISC_INC,C.MAX_DISC);
        st.isMisbehaving=false;
        st.attentionCallTime=null; st.attentionReason=null;
        this.sound.discipline();
        this.animState='discipline'; this.animTimer=Date.now();
        this.toast(`Discipline: ${st.discipline}%`);
        this.updateButtons();
        if(this.ai.on) this.ai.talk(st,'discipline').then(d=>{if(d)this.showDialogue(d);});
        break;
    }
  }

  doFeed(type){
    const st=this.state;
    if(st.isSleeping||st.isDead) return;
    if(type==='meal'){
      if(st.hunger>=C.MAX_HUNGER){ this.toast('Not hungry!'); this.sound.denied(); return; }
      st.hunger=Math.min(st.hunger+1,C.MAX_HUNGER);
      st.weight=Math.min(st.weight+C.MEAL_WT,C.MAX_WEIGHT);
      this.toast('Yum! Hunger +1');
    } else {
      if(st.happiness>=C.MAX_HAPPY){ this.toast('Already happy!'); this.sound.denied(); return; }
      st.happiness=Math.min(st.happiness+1,C.MAX_HAPPY);
      st.weight=Math.min(st.weight+C.SNACK_WT,C.MAX_WEIGHT);
      const now=Date.now();
      if(now-st.snackWindowStart>600000){ st.snacksInWindow=0; st.snackWindowStart=now; }
      st.snacksInWindow++;
      if(st.snacksInWindow>=C.SNACK_SICK) this.makeSick();
      this.toast('Yum! Happy +1');
    }
    this.sound.eat();
    this.animState='eat'; this.animTimer=Date.now();
    if(st.hunger>0&&st.happiness>0&&!st.isMisbehaving&&!st.isSick){
      st.attentionCallTime=null; st.attentionReason=null;
    }
    this.updateButtons();
    if(this.ai.on) this.ai.talk(st,type==='meal'?'fed_meal':'fed_snack').then(d=>{if(d)this.showDialogue(d);});
  }

  showStats(){
    const st=this.state;
    const hF='\u2665', hE='\u2661';
    const hungerH=hF.repeat(st.hunger)+hE.repeat(C.MAX_HUNGER-st.hunger);
    const happyH=hF.repeat(st.happiness)+hE.repeat(C.MAX_HAPPY-st.happiness);
    const name=st.character.charAt(0).toUpperCase()+st.character.slice(1);
    document.getElementById('stats-content').innerHTML=`
      <div class="stat-row"><span>Name</span><span>${name}</span></div>
      <div class="stat-row"><span>Stage</span><span>${st.stage}</span></div>
      <div class="stat-row"><span>Age</span><span>${st.age} days</span></div>
      <div class="stat-row"><span>Weight</span><span>${st.weight} lb</span></div>
      <div class="stat-row"><span>Hunger</span><span class="hearts">${hungerH}</span></div>
      <div class="stat-row"><span>Happy</span><span class="hearts">${happyH}</span></div>
      <div class="stat-row"><span>Discipline</span><span>${st.discipline}%</span></div>
    `;
    this.openOverlay('stats-overlay');
  }

  // -- MINI-GAME --
  startGame(){
    this.gameActive=true; this.gameRound=0; this.gameWins=0;
    this.gamePhase='waiting';
    this.nextGameRound();
    this.openOverlay('game-overlay');
  }

  nextGameRound(){
    if(this.gameRound>=5){ this.finishGame(); return; }
    this.gameDir=Math.random()<.5?0:1;
    this.gamePhase='waiting';
    document.getElementById('game-score').textContent=`Round ${this.gameRound+1}/5 | Wins: ${this.gameWins}`;
    document.getElementById('game-result').innerHTML='Tap an arrow!';
    document.getElementById('guess-left').classList.remove('disabled');
    document.getElementById('guess-right').classList.remove('disabled');
    const sp=SP[this.state.character];
    if(sp) this.renderer.renderToCanvas(document.getElementById('game-pet-canvas'),sp.idle1);
  }

  gameGuess(dir){
    if(this.gamePhase!=='waiting'||!this.gameActive) return;
    this.gamePhase='reveal';
    document.getElementById('guess-left').classList.add('disabled');
    document.getElementById('guess-right').classList.add('disabled');
    const won=dir===this.gameDir;
    if(won) this.gameWins++;
    this.state.weight=Math.max(1,this.state.weight-C.GAME_WT_LOSS);
    const dirText=this.gameDir===0?'LEFT':'RIGHT';
    document.getElementById('game-result').textContent=`Pet went ${dirText}! ${won?'Correct!':'Wrong!'}`;
    document.getElementById('game-score').textContent=`Round ${this.gameRound+1}/5 | Wins: ${this.gameWins}`;
    const sp=SP[this.state.character];
    if(sp){
      const frame=won?'happy':'sad';
      this.renderer.renderToCanvas(document.getElementById('game-pet-canvas'),sp[frame]||sp.idle1);
    }
    this.sound[won?'happy':'sad']();
    this.gameRound++;
    setTimeout(()=>{
      if(this.gameRound>=5) this.finishGame();
      else this.nextGameRound();
    },1200);
  }

  finishGame(){
    this.gameActive=false;
    const won=this.gameWins>=3;
    if(won){
      this.state.happiness=Math.min(this.state.happiness+1,C.MAX_HAPPY);
      this.sound.gameWin();
      document.getElementById('game-result').textContent=`You won ${this.gameWins}/5! +1 Happy`;
    } else {
      this.sound.gameLose();
      document.getElementById('game-result').textContent=`You lost ${this.gameWins}/5. Try again!`;
    }
    document.getElementById('game-score').textContent='Game Over!';
    document.getElementById('guess-left').classList.add('disabled');
    document.getElementById('guess-right').classList.add('disabled');
    if(this.ai.on) this.ai.talk(this.state,won?'played_won':'played_lost').then(d=>{if(d)this.showDialogue(d);});
    setTimeout(()=>{this.closeOverlay('game-overlay'); this.updateButtons();},2500);
  }

  // -- RENDERING --
  render(){
    const R=this.renderer, st=this.state;
    R.clear();
    this.frame++;

    if(st.isDead){
      R.drawSprite(SP.grave,13,8);
      if(this.frame%90<45) R.drawSprite(SP.angel,13,1);
      R.render(); return;
    }

    const now=Date.now();

    // Animation override
    if(this.animState&&now-this.animTimer<2000){
      this.renderAnim(R,st);
      R.render(st.isSleeping&&!st.lightOn); return;
    }
    this.animState=null;

    if(st.stage==='egg'){
      const sp=this.frame%90<45?SP.egg.idle1:SP.egg.idle2;
      R.drawSprite(sp,12,2);
      // Show hatching progress bar
      const frac=(now-st.stageStartTime)/C.EGG_MS;
      R.drawBar(6,12,20,frac);
      R.drawText('EGG',11,14);
      R.render(); return;
    }

    if(st.isSleeping){
      const sp=SP[st.character];
      if(sp){
        const f=sp.idle1;
        const cx=Math.floor((32-f[0].length)/2);
        const cy=Math.floor((16-f.length)/2)+1;
        R.drawSprite(f,cx,cy);
      }
      if(this.frame%60<30) R.drawSprite(SP.zzz,23,1);
      else R.drawSprite(SP.zzz,24,2);
      R.render(!st.lightOn); return;
    }

    // Normal idle
    const sp=SP[st.character];
    if(sp){
      const fk=this.frame%90<45?'idle1':'idle2';
      const f=sp[fk]||sp.idle1;
      const cx=Math.floor((32-f[0].length)/2);
      const cy=Math.floor((16-f.length)/2)+1;
      R.drawSprite(f,cx,cy);
    }

    // Poop
    for(let i=0;i<st.poopCount;i++){
      const px=27-(i%2)*5;
      const py=11-Math.floor(i/2)*5;
      R.drawSprite(SP.poop,px,py);
    }

    // Skull if sick
    if(st.isSick&&this.frame%60<40) R.drawSprite(SP.skull,1,1);

    // Misbehaving
    if(st.isMisbehaving&&this.frame%40<20) R.drawText('!',1,8);

    // Mini hunger/happy indicators at bottom
    R.drawHearts(st.hunger,4,1,13);
    R.drawHearts(st.happiness,4,1,8);

    R.render();
  }

  renderAnim(R,st){
    const sp=SP[st.character];
    if(!sp) return;
    const frame=sp[this.animState]||sp.eat||sp.idle1;
    const cx=Math.floor((32-frame[0].length)/2);
    const cy=Math.floor((16-frame.length)/2)+1;
    switch(this.animState){
      case 'eat':
        R.drawSprite(frame,cx,cy);
        if(this.frame%30<15) R.drawSprite(SP.meal,cx-6,cy+2);
        break;
      case 'evolve':
        if(this.frame%20<10) R.drawSprite(frame,cx,cy);
        break;
      case 'discipline':
        R.drawSprite(frame,cx,cy);
        if(this.frame%20<10) R.drawText('!',cx+frame[0].length+1,cy);
        break;
      case 'medicine':
        R.drawSprite(frame,cx,cy);
        R.drawText('+',cx-4,cy);
        break;
      case 'clean':
        R.drawSprite(sp.happy||sp.idle1,cx,cy);
        break;
      default:
        R.drawSprite(frame,cx,cy);
    }
  }

  // -- UI --
  openOverlay(id){ document.getElementById(id).classList.add('show'); }
  closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

  showDeath(){
    document.getElementById('death-msg').textContent=
      `Your ${this.state.character} lived for ${this.state.age} days.`;
    this.openOverlay('death-overlay');
    document.getElementById('attention-bar').classList.remove('active');
  }

  showDialogue(text){
    const el=document.getElementById('dialogue');
    el.textContent=''; el.classList.add('show');
    let i=0;
    const iv=setInterval(()=>{
      if(i<text.length){ el.textContent+=text[i]; i++; }
      else{ clearInterval(iv); setTimeout(()=>el.classList.remove('show'),4000); }
    },40);
  }
}

// -- BOOT --
document.addEventListener('DOMContentLoaded',()=>{ window.app=new TamagotchiApp(); });
</script>
