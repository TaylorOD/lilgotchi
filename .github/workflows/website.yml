name: website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lilgotchi-demo-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test and build
        run: |
          npm test
          npm run build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: demo
          path: published-site
      - name: Update website and preserve published releases
        run: |
          node scripts/sync-website.mjs dist published-site
          cd published-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'update website'
            git push origin HEAD:demo
          fi
      - name: Publish and verify Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .url)
          for attempt in {1..60}; do
            status=$(gh api "$build_url" --jq .status)
            if [ "$status" = built ]; then
              exit 0
            fi
            if [ "$status" = errored ]; then
              gh api "$build_url" --jq .error
              exit 1
            fi
            sleep 10
          done
          echo 'Pages deployment did not finish within ten minutes'
          exit 1
