name: preview
on:
  pull_request:
    branches: [main, codex/original-p1-p2, codex/wider-homepage, codex/pet-colors]
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: read
concurrency:
  group: lilgotchi-demo-publication
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event.action != 'closed'
        with:
          node-version: '22'
      - name: Test and build
        if: github.event.action != 'closed'
        run: |
          npm test
          npm run build
      - name: Isolate preview saves
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: node scripts/prepare-preview.mjs "$PR_NUMBER"
      - name: Publish preview link
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: ./dist/
          preview-branch: demo
          umbrella-dir: pr-preview
          pages-base-url: www.taylordorsett.com/lilgotchi
          wait-for-pages-deployment: true
          qr-code: false
