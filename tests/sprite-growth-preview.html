<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite growth comparison</title>
<style>body{margin:0;padding:24px;background:#161b19;color:#f4efdf;font:15px system-ui}main{max-width:1100px;margin:auto}h1{margin:0;font-size:28px}p{color:#bdc8be}nav{display:flex;gap:10px;margin:16px 0}button,select{font:inherit;padding:8px 18px;border:1px solid #69786c;background:#28362d;color:inherit;border-radius:8px}button[aria-pressed=true]{background:#e7c88d;color:#182219}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#222b25;border:1px solid #455349;border-radius:12px;padding:12px;text-align:center}.card h2{font-size:15px;margin:0 0 4px}.pair{display:flex;justify-content:space-evenly;gap:8px}.label{font-size:12px;color:#c5cdbf}canvas{display:block;image-rendering:pixelated;margin:5px auto}.refs{display:flex;align-items:end;gap:24px;margin:18px 0}.ref{text-align:center}.ref canvas{background:#c4cfa1}section.game{display:flex;flex-wrap:wrap;gap:16px}lil-gotchi{width:320px}a{color:#e7c88d}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:12px}}</style>
<main><h1>Room to grow</h1><p>Before and after at the same pixel scale. Quail Egg stays small. Gen 1 and Gen 2 stay unchanged.</p><nav><button data-family="slice" aria-pressed="true">Slice</button><button data-family="cyberpunk" aria-pressed="false">Cypunk</button><button data-family="lilgotchi" aria-pressed="false">Lilgotchi</button><select aria-label="New expression"><option>idle1</option><option>idle2</option><option>happy</option><option>sad</option><option>eat</option><option>sleep</option><option>lookLeft</option><option>lookRight</option><option>lookUp</option></select></nav><div class="grid"></div><div class="refs"></div><h2>In the game</h2><p>Separate preview pets with their own saves.</p><section class="game"></section></main>
<script type="module">
import {sliceSprites,slicePalette,sliceNames} from '../pets/slice-sprites.js';
import {cyberpunkSprites,cyberpunkPalette,cyberpunkNames} from '../pets/cyberpunk-sprites.js';
import {lilgotchiSprites,lilgotchiPalette,lilgotchiNames} from '../pets/lilgotchi-sprites.js';
import {originalSprites} from '../pets/original-sprites.js';
import {GameState} from '../pets/engine.js';import {getCharacter} from '../pets/catalog.js';import {SaveStore} from '../widget/save-store.js';import '../lilgotchi.js';
const before=await(await fetch('./sprite-growth-before.json')).json();
const current={slice:{sprites:sliceSprites,palette:slicePalette,names:sliceNames},cyberpunk:{sprites:cyberpunkSprites,palette:cyberpunkPalette,names:cyberpunkNames},lilgotchi:{sprites:lilgotchiSprites,palette:lilgotchiPalette,names:lilgotchiNames}};
let family='slice';
function height(frame){const ys=frame.flatMap((row,y)=>row.some(Boolean)?[y]:[]);return Math.max(...ys)-Math.min(...ys)+1;}
function picture(frame,palette){const c=document.createElement('canvas');c.width=96;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#20281d';ctx.fillRect(0,0,96,96);const left=Math.floor((16-frame[0].length)/2),top=16-frame.length;frame.forEach((row,y)=>row.forEach((v,x)=>{if(v){ctx.fillStyle=palette[v]||'#0f380f';ctx.fillRect((x+left)*6,(y+top)*6,6,6)}}));return c;}
function render(){const target=document.querySelector('.grid');target.replaceChildren();const data=current[family],pose=document.querySelector('select').value;for(const [id,frames] of Object.entries(data.sprites)){const old=before[family].sprites[id].idle1,newFrame=frames[pose]||frames.idle1;const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${data.names[id]}</h2><div class="pair"><div class="old"><span class="label">Before · ${height(old)} px</span></div><div class="new"><span class="label">After · ${height(newFrame)} px</span></div></div>`;card.querySelector('.old').append(picture(old,data.palette));card.querySelector('.new').append(picture(newFrame,data.palette));target.append(card);}document.querySelectorAll('[data-family]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.family===family));}
document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{family=b.dataset.family;render()});document.querySelector('select').onchange=render;render();
for(const id of ['babytchi','marutchi','tamatchi','mametchi','mimitchi','zuccitchi']){const e=document.createElement('div');e.className='ref';e.textContent=id+' · '+height(originalSprites[id].idle1)+' px';e.append(picture(originalSprites[id].idle1,['','#b4ce83']));document.querySelector('.refs').append(e);}
for(const [f,id] of [['slice','mametchi'],['cyberpunk','tarakotchi'],['lilgotchi','kuchipatchi'],['lilgotchi','ginjirotchi']]){const key='sprite-growth-'+f+id+'-'+Date.now();const store=new SaveStore(key);await store.acquire(f);store.load(f);const state=new GameState(getCharacter(f));Object.assign(state,{stage:'adult',character:id,age:5,discipline:100,hunger:4,happiness:4,weight:30,sleepOverride:'wake',sleepOverrideUntil:Date.now()+7200000});store.save(f,state);store.preference('introduced',true);store.release(f);await store.pendingReleases.get(f);const pet=document.createElement('lil-gotchi');pet.setAttribute('character',f);pet.setAttribute('storage-key',key);pet.setAttribute('mode','inline');pet.setAttribute('muted','');document.querySelector('.game').append(pet);}
</script></html>
