<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>lilgotchi comparison</title>
<style>body{margin:24px;background:#101416;color:#e9eee9;font:15px system-ui}h1{font-size:24px}form{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}label{display:grid;gap:5px}select,input,button{padding:8px;background:#242b2d;color:inherit;border:1px solid #64716a;border-radius:5px}.frames{display:flex;flex-wrap:wrap;gap:20px}iframe{width:380px;max-width:100%;height:480px;border:0}section{max-width:100%}p{max-width:800px;line-height:1.5}</style></head>
<body><h1>lilgotchi comparison</h1><p>Frozen review fixtures. No saves, time progression or network requests. Default compares against the pinned original. Custom families use the original as a layout and reaction reference.</p>
<form><label>Family<select name="pet"><option value="classic">Default</option><option value="pizza">Slice</option><option value="cyberpunk">Cyberpunk</option></select></label><label>Character<select name="identity"></select></label><label>Reaction<select name="reaction"></select></label><label>Frame<input name="frame" type="number" min="0" max="180" value="0"></label><label>Theme<select name="theme"><option value="default">Default</option><option value="eink">E ink</option></select></label><label>Animate fork<input name="animate" type="checkbox" value="1"></label><button>Apply fixture</button></form>
<div class="frames"><section><h2>Pinned original</h2><iframe id="original" title="Original fixture"></iframe></section><section><h2>lilgotchi</h2><iframe id="fork" title="lilgotchi fixture"></iframe></section></div><script type="module" src="review.js"></script></body></html>
